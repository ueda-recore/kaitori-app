<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>買取アプリ（試作）</title>
<style>
*{box-sizing:border-box}body{margin:0;font:15px/1.5 -apple-system,"Hiragino Sans",sans-serif;background:#f4f5f7;color:#1c1f26;padding-bottom:70px}
header{background:#1c1f26;color:#fff;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
.badge{font-size:11px;padding:2px 8px;border-radius:10px;background:#e8a317;color:#000}.badge.live{background:#2fb344;color:#fff}
nav{display:flex;overflow-x:auto;background:#fff;border-bottom:1px solid #ddd}
nav button{flex:1;min-width:64px;border:0;background:none;padding:10px 4px;font-size:12px;color:#777;border-bottom:3px solid transparent}
nav button.on{color:#1c1f26;border-color:#2b6cff;font-weight:700}nav button.done{color:#2fb344}
main{padding:12px;max-width:640px;margin:0 auto}
.card{background:#fff;border-radius:10px;padding:12px;margin-bottom:12px;box-shadow:0 1px 2px #0001}
h2{font-size:16px;margin:0 0 8px}label{display:block;font-size:12px;color:#666;margin-top:8px}
input,select,textarea{width:100%;padding:10px;font-size:16px;border:1px solid #ccd;border-radius:8px;background:#fff}
.row{display:flex;gap:8px}.row>*{flex:1}
button.p{width:100%;margin-top:10px;padding:12px;font-size:16px;border:0;border-radius:8px;background:#2b6cff;color:#fff}
button.s{padding:8px 12px;border:1px solid #2b6cff;background:#fff;color:#2b6cff;border-radius:8px;font-size:14px}
button.p:disabled{background:#aab}
.item{padding:10px;border:1px solid #e3e5ea;border-radius:8px;margin-top:8px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.muted{color:#777;font-size:12px}.ok{color:#2fb344}.ng{color:#d63939}
canvas{width:100%;height:180px;border:2px dashed #aab;border-radius:8px;background:#fff;touch-action:none}
#logbar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ccc;z-index:9}
#logbar>div:first-child{padding:10px 14px;display:flex;justify-content:space-between;font-size:13px}
#log{display:none;max-height:55vh;overflow:auto;padding:0 10px 10px;font:12px/1.4 ui-monospace,monospace}
#log details{border-top:1px solid #eee;padding:4px 0}#log pre{white-space:pre-wrap;word-break:break-all;margin:4px 0;background:#f4f5f7;padding:6px;border-radius:6px}
.st2{color:#2fb344}.st4{color:#d63939}.st5{color:#d63939}
</style></head><body>
<header><b>買取アプリ（試作）</b><span><span id="mode" class="badge">…</span> <button class="s" style="padding:2px 8px" onclick="S.settings=!S.settings;render()">⚙設定</button></span></header>
<nav id="nav"></nav>
<main id="main"></main>
<div id="logbar"><div onclick="toggleLog()"><span>▲ API通信ログ（<span id="logn">0</span>件）</span><span><button class="s" onclick="event.stopPropagation();copyLog()">ログをコピー</button></span></div><div id="log"></div></div>

<script>
const STEPS=['顧客','商品','ケース','本人確認','サイン','支払い','完了・検証'];
const S={settings:false,step:0,member:null,goods:[],caseId:null,caseRes:null,idId:null,done:{},storeId:localStorage.storeId||'',sig:null,photoOk:false};
const LOG=[];let MODE={};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const val=id=>(document.getElementById(id)||{}).value||'';

const CFG=Object.assign({base:'https://co-api.recore-pos.com',key:'',prefix:'',store:'',mock:true},JSON.parse(localStorage.kcfg||'{}'));
const saveCfg=()=>localStorage.kcfg=JSON.stringify(CFG);
/* ---- ブラウザ内モック ---- */
const db={members:[],products:[],cases:[],idents:[],seq:100};const nid=()=>++db.seq;
function mock(method,p,q,b){let m;
 if(p==='/members'&&method==='GET'){const k=q.get('keyword')||'';return[200,db.members.filter(x=>!k||JSON.stringify(x).includes(k))]}
 if(p==='/members'&&method==='POST'){const x={id:nid(),code:'M'+db.seq,...b};db.members.push(x);return[201,x]}
 if(p==='/products'&&method==='GET'){const t=q.get('title')||'',j=q.get('pa_jan')||'';return[200,db.products.filter(x=>(!t||x.title.includes(t))&&(!j||(x.attribute||{}).jan===j))]}
 if(p==='/products'&&method==='POST'){if(!b.title)return[422,{message:'title required'}];const x={id:nid(),...b};db.products.push(x);return[201,x]}
 if(p==='/v2/bas_cases'&&method==='POST'){const x={id:nid(),status:'ASSESSING',...b,goods:(b.goods||[]).map(g=>({id:nid(),...g})),attachments:[],txns:[]};x.summary={total:x.goods.reduce((s,g)=>s+g.quantity*g.unit_price,0)};db.cases.push(x);return[201,x]}
 if((m=p.match(/^\/v2\/bas_cases\/(\d+)$/))&&method==='GET'){const x=db.cases.find(y=>y.id==m[1]);return x?[200,x]:[404,{message:'not found'}]}
 if((m=p.match(/^\/v2\/bas_cases\/(\d+)\/status$/))&&method==='PUT'){const x=db.cases.find(y=>y.id==m[1]);const ok={ASSESSING:['ASSESSED'],ASSESSED:['CONFIRMED','ASSESSING','CANCELED'],CONFIRMED:['CANCELED']};if(!x||!(ok[x.status]||[]).includes(b.status))return[422,{message:`(mock) cannot change ${x&&x.status} -> ${b.status}`}];x.status=b.status;return[200,x]}
 if((m=p.match(/^\/v2\/bas_cases\/(\d+)\/(txns|attachments)$/))&&method==='POST'){const x=db.cases.find(y=>y.id==m[1]);(x[m[2]]=x[m[2]]||[]).push(b);return[201,{id:nid(),...b}]}
 if(p==='/identifications'&&method==='POST'){const x={id:nid(),status:'IN_PROGRESS',attachments:[],...b};db.idents.push(x);return[201,x]}
 if((m=p.match(/^\/identifications\/(\d+)\/attachments$/))&&method==='POST')return[201,{id:nid(),...b}];
 if((m=p.match(/^\/identifications\/(\d+)\/status$/))&&method==='PUT'){const x=db.idents.find(y=>y.id==m[1]);if(x)x.status=b.status;return[200,x||{}]}
 if((m=p.match(/^\/identifications\/(\d+)$/))&&method==='GET'){const x=db.idents.find(y=>y.id==m[1]);return x?[200,x]:[404,{}]}
 return[404,{message:`(mock) not implemented: ${method} ${p}`}]}
/* ---- API呼び出し（モック or 直接） ---- */
async function api(method,path,body,hdr={}){
  const t0=Date.now();let status,j;
  try{
    if(CFG.mock){const u=new URL('http://x'+path);[status,j]=mock(method,u.pathname,u.searchParams,body||{})}
    else{const h={Authorization:CFG.prefix+CFG.key,...(body?{'Content-Type':'application/json'}:{}),...(CFG.store?{'X-Store-Id':CFG.store}:{}),...hdr};
      const r=await fetch(CFG.base.replace(/\/$/,'')+path,{method,headers:h,body:body?JSON.stringify(body):undefined});status=r.status;const text=await r.text();try{j=JSON.parse(text)}catch{j=text}}
  }catch(e){status=0;j={network_error:String(e),hint:'CORSで拒否された可能性があります（設定のプロキシURL参照）'}}
  LOG.unshift({t:new Date().toLocaleTimeString(),method,path,status,ms:Date.now()-t0,req:body,res:j});renderLog();
  if(status<200||status>=300)throw Object.assign(new Error(`${method} ${path} → ${status}`),{res:j});
  return j&&j.data!==undefined&&!Array.isArray(j)?j.data:j;
}
async function upload(kind,blob){
  const mime=blob.type||'image/jpeg';
  if(CFG.mock){const j={file_key:'mock/'+Date.now(),mime_type:mime,bytes:blob.size};LOG.unshift({t:new Date().toLocaleTimeString(),method:'UPLOAD',path:'/upload/'+kind,status:200,ms:0,req:{bytes:blob.size,type:mime},res:j});renderLog();return j}
  const j1=await api('POST','/upload/'+kind,{mime_type:mime});const u=j1.url,fk=j1.file_key; // 署名URLは60秒で失効
  const t0=Date.now();let st=0,res;
  try{const r=await fetch(u,{method:'PUT',headers:{'Content-Type':mime},body:blob});st=r.status;res=st>=200&&st<300?{ok:true}:await r.text()}catch(e){res={network_error:String(e),hint:'署名URL(PUT)がCORSで拒否された可能性'}}
  LOG.unshift({t:new Date().toLocaleTimeString(),method:'PUT',path:'(署名URL) '+kind,status:st,ms:Date.now()-t0,req:{bytes:blob.size,type:mime},res});renderLog();
  if(st<200||st>=300)throw Object.assign(new Error('ファイルPUT失敗'),{res});
  return{file_key:fk,mime_type:mime}}
function renderLog(){$('#logn').textContent=LOG.length;$('#log').innerHTML=LOG.map(l=>`<details><summary class="st${String(l.status)[0]}">${l.t} ${l.method} ${esc(l.path)} → ${l.status} (${l.ms}ms)</summary><b>request</b><pre>${esc(JSON.stringify(l.req,null,1))}</pre><b>response</b><pre>${esc(JSON.stringify(l.res,null,1))}</pre></details>`).join('')}
function toggleLog(){const l=$('#log');l.style.display=l.style.display==='block'?'none':'block'}
function copyLog(){navigator.clipboard.writeText(JSON.stringify(LOG.slice().reverse(),null,1)).then(()=>alert('コピーしました（個人情報を含むため共有先に注意）'))}
function msg(id,text,ok){const e=document.getElementById(id);if(e)e.innerHTML=`<span class="${ok?'ok':'ng'}">${esc(text)}</span>`}
async function run(id,fn){try{await fn()}catch(e){msg(id,e.message+' ／ 詳細はログ参照',false);console.error(e)}}
function go(n){S.step=n;render()}
function mark(k){S.done[k]=true}

function updMode(){const b=$('#mode');b.textContent=CFG.mock?'MOCK（ダミー応答）':'LIVE';b.className='badge'+(CFG.mock?'':' live')}
function vSet(){return `<div class="card"><h2>設定（この端末のブラウザにだけ保存）</h2><label>モード</label><select id="cm"><option value="1" ${CFG.mock?'selected':''}>MOCK（ダミー応答・安全）</option><option value="0" ${CFG.mock?'':'selected'}>LIVE（実API）</option></select><label>API Base URL（直接 or プロキシのURL）</label><input id="cb" value="${esc(CFG.base)}"><label>APIキー（テスト店舗のもの）</label><input id="ck" type="password" value="${esc(CFG.key)}"><label>Authorization接頭辞（不要なら空。例: Bearer ）</label><input id="cp" value="${esc(CFG.prefix)}"><label>店舗ID（X-Store-Id・キーが店舗固定なら空）</label><input id="cs" value="${esc(CFG.store)}"><button class="p" onclick="saveSet()">保存</button><div class="muted" style="margin-top:8px">⚠ キーはこの端末の localStorage に保存されます。テスト店舗のキーだけを使い、共用端末では入力しないでください。</div></div>`}
function saveSet(){CFG.mock=val('cm')==='1';CFG.base=val('cb')||'https://co-api.recore-pos.com';CFG.key=val('ck').trim();CFG.prefix=val('cp');CFG.store=val('cs').trim();saveCfg();S.settings=false;updMode();render()}
function render(){
  $('#nav').innerHTML=STEPS.map((s,i)=>`<button class="${i==S.step?'on':''} ${S.done[i]?'done':''}" onclick="go(${i})">${i+1}.${s}</button>`).join('');
  $('#main').innerHTML=(S.settings?vSet():'')+[v0,v1,v2,v3,v4,v5,v6][S.step]();
  if(S.step==4)initSig();
}

/* 1 顧客 */
function v0(){return `<div class="card"><h2>会員検索</h2><input id="kw" placeholder="氏名・電話・メール・会員コード" onkeydown="if(event.key=='Enter')searchM()"><button class="p" onclick="searchM()">検索</button><div id="mres"></div></div>
${S.member?`<div class="card"><h2>選択中の顧客</h2>${memberView(S.member)}<button class="p" onclick="mark(0);go(1)">この顧客で進む →</button></div>`:''}
<div class="card"><h2>新規会員登録</h2>
<div class="row"><div><label>姓</label><input id="ln"></div><div><label>名</label><input id="fn"></div></div>
<div class="row"><div><label>セイ</label><input id="lk"></div><div><label>メイ</label><input id="fk"></div></div>
<label>郵便番号</label><input id="pc" inputmode="numeric" placeholder="123-4567">
<label>都道府県</label><input id="pf"><label>住所1</label><input id="a1"><label>住所2（建物名）</label><input id="a2">
<label>電話</label><input id="tel" inputmode="tel"><label>生年月日</label><input id="bd" type="date">
<div class="row"><div><label>職業（20文字まで）</label><input id="oc"></div><div><label>性別</label><select id="sx"><option value="">未選択</option><option>MALE</option><option>FEMALE</option><option>OTHER</option></select></div></div>
<button class="p" onclick="createM()">登録して選択</button><div id="mmsg"></div></div>`}
const memberView=m=>`<div><b>${esc(m.last_name)} ${esc(m.first_name)}</b> <span class="muted">#${m.id} ${esc(m.code||'')}</span></div><div class="muted">〒${esc(m.postal_code)} ${esc(m.prefecture)}${esc(m.address1)}${esc(m.address2)}<br>${esc(m.tel)} / ${esc(m.birthdate)} / ${esc(m.occupation)}</div>`;
async function searchM(){await run('mres',async()=>{const r=await api('GET','/members?keyword='+encodeURIComponent(val('kw')));window._ms=r;$('#mres').innerHTML=(r.length?r:[]).map((m,i)=>`<div class="item"><div>${memberView(m)}</div><button class="s" onclick="pickM(${i})">選択</button></div>`).join('')||'<div class="muted">該当なし</div>'})}
function pickM(i){S.member=window._ms[i];render()}
async function createM(){await run('mmsg',async()=>{const b={last_name:val('ln'),first_name:val('fn'),last_kana:val('lk'),first_kana:val('fk'),postal_code:val('pc'),prefecture:val('pf'),address1:val('a1'),address2:val('a2'),tel:val('tel'),birthdate:val('bd')||null,occupation:val('oc'),sex:val('sx')||null,status:'ACTIVE'};
  const r=await api('POST','/members',b);S.member=r;render()})}

/* 2 商品 */
function v1(){return `<div class="card"><h2>商品検索</h2><div class="row"><input id="pq" placeholder="商品名 または JAN"><button class="s" style="flex:0 0 80px" onclick="searchP()">検索</button></div><div id="pres"></div></div>
<div class="card"><h2>新規商品登録（必須は商品名のみ）</h2><label>商品名</label><input id="pt"><label>JAN（任意）</label><input id="pj" inputmode="numeric"><button class="p" onclick="createP()">登録して明細に追加</button><div id="pmsg"></div></div>
<div class="card"><h2>買取明細（${S.goods.length}点）</h2>${S.goods.map((g,i)=>`<div class="item"><div><b>${esc(g.title)}</b><div class="row"><div><label>数量</label><input type="number" value="${g.quantity}" onchange="S.goods[${i}].quantity=+this.value"></div><div><label>買取単価</label><input type="number" value="${g.unit_price}" onchange="S.goods[${i}].unit_price=+this.value"></div></div><label>状態メモ（取引時点の特徴をここにも残す）</label><input value="${esc(g.condition_note)}" onchange="S.goods[${i}].condition_note=this.value"></div><button class="s" onclick="S.goods.splice(${i},1);render()">削除</button></div>`).join('')||'<div class="muted">未追加</div>'}
${S.goods.length?`<button class="p" onclick="mark(1);go(2)">ケース作成へ →</button>`:''}</div>`}
async function searchP(){await run('pres',async()=>{const q=val('pq');const isJan=/^\d{8,13}$/.test(q);const r=await api('GET','/products?'+(isJan?'pa_jan=':'title=')+encodeURIComponent(q));window._ps=r;$('#pres').innerHTML=r.map((p,i)=>`<div class="item"><div>${esc(p.title)}<div class="muted">#${p.id}</div></div><button class="s" onclick="addG(_ps[${i}])">追加</button></div>`).join('')||'<div class="muted">該当なし</div>'})}
function addG(p){S.goods.push({product_id:p.id,title:p.title,quantity:1,unit_price:0,condition_note:''});render()}
async function createP(){await run('pmsg',async()=>{const b={title:val('pt')};if(val('pj'))b.attribute={jan:val('pj')};const p=await api('POST','/products',b);addG(p)})}

/* 3 ケース */
function v2(){return `<div class="card"><h2>買取ケース作成</h2><div class="muted">顧客: ${S.member?esc(S.member.last_name+' '+S.member.first_name):'<span class=ng>未選択</span>'} ／ 明細 ${S.goods.length}点 ／ 合計 ¥${S.goods.reduce((s,g)=>s+g.quantity*g.unit_price,0).toLocaleString()}</div>
${CFG.store?'':`<label>店舗ID（X-Store-Id）</label><input id="sid" value="${esc(S.storeId)}" inputmode="numeric">`}
<button class="p" ${S.caseId?'disabled':''} onclick="createCase()">ケース作成（POST /v2/bas_cases）</button><div id="cmsg">${S.caseId?`<span class=ok>作成済み case_id=${S.caseId}</span>`:''}</div></div>
${S.caseId?`<div class="card"><h2>顧客の顔写真（任意）</h2><input type="file" accept="image/*" capture="user" id="photo"><button class="s" style="margin-top:8px" onclick="attachPhoto()">PHOTOとして添付</button><div id="phmsg"></div><button class="p" onclick="mark(2);go(3)">本人確認へ →</button></div>`:''}`}
async function createCase(){await run('cmsg',async()=>{if(!S.member)throw new Error('顧客を選んでください');if(!CFG.store){S.storeId=val('sid');localStorage.storeId=S.storeId}
  const m=S.member;const b={member_id:m.id,last_name:m.last_name,first_name:m.first_name,last_kana:m.last_kana,first_kana:m.first_kana,postal_code:m.postal_code,prefecture:m.prefecture,address1:m.address1,address2:m.address2,tel:m.tel,email:m.email,sex:m.sex,birthdate:m.birthdate,occupation:m.occupation,
   goods:S.goods.map(g=>({product_id:g.product_id,quantity:g.quantity,unit_price:g.unit_price,condition_note:g.condition_note}))};
  const r=await api('POST','/v2/bas_cases',b,S.storeId?{'X-Store-Id':S.storeId}:{});S.caseId=r.id;S.caseRes=r;render()})}
async function attachPhoto(){await run('phmsg',async()=>{const f=$('#photo').files[0];if(!f)throw new Error('写真を選んでください');const u=await upload('private',f);await api('POST',`/v2/bas_cases/${S.caseId}/attachments`,{file_key:u.file_key,tag:'PHOTO',file_name:'face.jpg'});msg('phmsg','添付しました',true)})}

/* 4 本人確認 */
function v3(){return `<div class="card"><h2>本人確認（対面）</h2><div class="muted">case_id=${S.caseId||'未作成'}</div>
<label>書類種別</label><select id="dt"><option value="DRIVERS_LICENSE">運転免許証</option><option value="MY_NUMBER_CARD">マイナンバーカード</option><option value="PASSPORT">パスポート</option><option value="RESIDENCE_CARD">在留カード</option><option value="OTHER">その他</option></select>
<label>書類番号（30文字まで）</label><input id="dn"><label>有効期限</label><input id="de" type="date"><label>書類画像（表）</label><input type="file" accept="image/*" capture="environment" id="dimg">
<button class="p" ${S.idId?'disabled':''} onclick="doIdent()">本人確認を登録して確認済みにする</button><div id="imsg">${S.idId?`<span class=ok>完了 identification_id=${S.idId}</span>`:''}</div>
${S.idId?`<button class="p" onclick="mark(3);go(4)">サインへ →</button>`:''}</div>`}
async function doIdent(){await run('imsg',async()=>{if(!S.caseId)throw new Error('先にケースを作成してください');
  const i=await api('POST','/identifications',{method:'IN_PERSON',document_type:val('dt'),document_number:val('dn')||null,expires_on:val('de')||null,referable_id:S.caseId,referable_type:'rt_bas'});S.idId=i.id;
  const f=$('#dimg').files[0];if(f){const u=await upload('private',f);await api('POST',`/identifications/${S.idId}/attachments`,{file_key:u.file_key,tag:'IDENTIFICATION',file_name:'id.jpg'})}
  await api('PUT',`/identifications/${S.idId}/status`,{status:'CONFIRMED'});render()})}

/* 5 サイン */
function v4(){return `<div class="card"><h2>売買契約書へのサイン</h2><div class="muted">契約書の表示・PDF生成は未実装（RECORE側仕様の確認待ち）。ここではサイン画像をSIGNATUREとして添付します。</div>
<canvas id="cv"></canvas><div class="row"><button class="s" onclick="clearSig()">書き直し</button><button class="p" style="margin-top:0" onclick="saveSig()">サインを添付</button></div><div id="smsg">${S.sig?'<span class=ok>添付済み</span>':''}</div>
${S.sig?`<button class="p" onclick="mark(4);go(5)">支払いへ →</button>`:''}</div>`}
let drawing=false;
function initSig(){const c=$('#cv');if(!c)return;const r=c.getBoundingClientRect();c.width=r.width*2;c.height=r.height*2;const x=c.getContext('2d');x.scale(2,2);x.lineWidth=2.5;x.lineCap='round';x.fillStyle='#fff';x.fillRect(0,0,r.width,r.height);
  const pos=e=>{const b=c.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]};
  c.onpointerdown=e=>{drawing=true;c.setPointerCapture(e.pointerId);x.beginPath();x.moveTo(...pos(e))};c.onpointermove=e=>{if(drawing){x.lineTo(...pos(e));x.stroke()}};c.onpointerup=()=>drawing=false}
function clearSig(){initSig()}
async function saveSig(){await run('smsg',async()=>{const blob=await new Promise(r=>$('#cv').toBlob(r,'image/png'));const u=await upload('private',blob);await api('POST',`/v2/bas_cases/${S.caseId}/attachments`,{file_key:u.file_key,tag:'SIGNATURE',file_name:'signature.png'});S.sig=true;render()})}

/* 6 支払い */
function v5(){const tot=S.goods.reduce((s,g)=>s+g.quantity*g.unit_price,0);return `<div class="card"><h2>査定承認・支払い</h2>
<div class="muted">① 査定承認: ASSESSING→ASSESSED→CONFIRMED ／ ② 精算(txns)</div><div id="amsg"></div><button class="p" onclick="approve()">① 査定承認（ステータス進行）</button></div>
<div class="card"><label>支払方法（payment・値は仕様確認が必要。まず CASH）</label><input id="pay" value="CASH"><label>支払金額</label><input id="pamt" type="number" value="${tot}"><label>つり銭</label><input id="chg" type="number" value="0">
<button class="p" onclick="pay()">② 精算を登録（POST …/txns）</button><div id="pmsg2"></div>${S.done[5]?'<button class="p" onclick="go(6)">完了・検証へ →</button>':''}</div>`}
async function approve(){await run('amsg',async()=>{await api('PUT',`/v2/bas_cases/${S.caseId}/status`,{status:'ASSESSED'});await api('PUT',`/v2/bas_cases/${S.caseId}/status`,{status:'CONFIRMED'});msg('amsg','CONFIRMED になりました',true)})}
async function pay(){await run('pmsg2',async()=>{const a=+val('pamt');await api('POST',`/v2/bas_cases/${S.caseId}/txns`,{amount:a,tenders:[{payment:val('pay'),amount:a,change:+val('chg')}]});mark(5);msg('pmsg2','登録しました',true);render()})}

/* 7 検証 */
function v6(){return `<div class="card"><h2>未確認事項の検証</h2><div class="muted">ここでの結果が、開発への質問1〜3の答えになります。</div>
<button class="p" onclick="tryDone()">A. DONE への遷移を試す</button><div id="vA"></div>
<button class="p" onclick="refetch()">B. ケース・本人確認を再取得して中身を見る</button><div id="vB"></div></div>
<div class="card"><h2>C. RECORE管理画面で目視確認（手作業）</h2><ul style="padding-left:18px;margin:0"><li>古物台帳に、このケースが載っているか</li><li>古物台帳番号が発番されているか</li><li>売買契約書が出力でき、サイン・品目・本人確認が入っているか</li><li>会員・本人確認・添付画像が紐付いているか</li></ul><div class="muted" style="margin-top:6px">case_id=${S.caseId||'-'} ／ identification_id=${S.idId||'-'}</div></div>`}
async function tryDone(){await run('vA',async()=>{const r=await api('PUT',`/v2/bas_cases/${S.caseId}/status`,{status:'DONE'});msg('vA','DONEに遷移できました（ログ参照）',true)})}
async function refetch(){await run('vB',async()=>{const c=await api('GET','/v2/bas_cases/'+S.caseId);const i=S.idId?await api('GET','/identifications/'+S.idId):null;$('#vB').innerHTML=`<pre style="white-space:pre-wrap;font-size:11px">${esc(JSON.stringify({status:c.status,sub_status:c.sub_status,done_at:c.done_at,summary:c.summary,attachments:c.attachments,identification:i&&{status:i.status,attachments:i.attachments}},null,1))}</pre>`})}

render();updMode();</script></body></html>
